name: CI Pipeline - Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker Image
        working-directory: ./cloudpulse-app  # <--- Add this line
        run: |
          IMAGE_TAG=${{ github.sha }}
          ACR_SERVER=${{ secrets.ACR_NAME }}.azurecr.io
          
          docker build -t $ACR_SERVER/cloudpulse-app:$IMAGE_TAG .
          docker push $ACR_SERVER/cloudpulse-app:$IMAGE_TAG