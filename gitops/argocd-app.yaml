apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudpulse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/PROTIKPATRA/CloudPulse.git'
    targetRevision: HEAD
    path: gitops/app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true